<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guerra de Papel 3D - Dobra Realista com Verso da Folha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        .stage-3d {
            perspective: 2000px;
            perspective-origin: 50% 50%;
            width: 100%;
            max-width: 900px;
            height: 520px;
            position: relative;
        }

        .paper-board {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .leaf-half {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            transform-style: preserve-3d;
            border-radius: 4px;
            will-change: transform;
        }

        .leaf-left {
            left: 0;
            transform-origin: 100% center;
            z-index: 10;
        }

        .leaf-right {
            right: 0;
            transform-origin: 0% center;
            z-index: 10;
        }

        .leaf-front {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        .leaf-back {
            position: absolute;
            inset: 0;
            background-color: #f2efe4;
            background-image: 
                radial-gradient(#a3a3a3 0.8px, transparent 0.8px),
                linear-gradient(to right, rgba(0,0,0,0.18) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.12) 100%);
            background-size: 18px 18px, 100% 100%;
            transform: rotateY(180deg);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 4px;
            box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            z-index: 1;
        }

        .notebook-paper {
            background-color: #fbfaf5;
            background-image: 
                linear-gradient(90deg, transparent 55px, #f87171 55px, #f87171 57px, transparent 57px),
                linear-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 100% 100%, 100% 26px;
        }

        .shadow-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            transition: opacity 0.05s linear;
        }

        .table-surface {
            background: radial-gradient(circle at 50% 50%, #172033 0%, #080c14 100%);
        }
    </style>
</head>
<body class="table-surface min-h-screen flex flex-col items-center justify-between p-3 sm:p-5">

    <header class="w-full max-w-4xl flex flex-col sm:flex-row items-center justify-between gap-3 mb-2">
        <div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-amber-100 flex items-center gap-2">
                <span>📝</span> Guerra de Papel <span class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-0.5 rounded-full font-sans uppercase tracking-widest">3D</span>
            </h1>
            <p class="text-slate-400 text-xs mt-1">Atire no seu próprio lado para dobrar a folha e acertar o inimigo!</p>
        </div>
        
        <button onclick="abrirMenu()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-xs sm:text-sm rounded-lg shadow-lg hover:shadow-amber-500/20 transition-all active:scale-95 flex items-center gap-2">
            ⚙️ Menu / Configurações
        </button>
    </header>

    <div class="w-full max-w-4xl grid grid-cols-3 items-center gap-2 mb-3 bg-slate-800/80 backdrop-blur-md border border-slate-700/60 p-2.5 rounded-xl shadow-xl">
        <div class="flex items-center gap-2.5 pl-2">
            <div class="w-3.5 h-3.5 rounded-full bg-blue-600 ring-4 ring-blue-500/20"></div>
            <div>
                <div class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Jogador 1</div>
                <div id="p1-stats" class="text-sm sm:text-base font-extrabold text-blue-400">8 Vivos</div>
            </div>
        </div>

        <div class="text-center flex flex-col items-center gap-1">
            <div id="turn-badge" class="inline-block px-4 py-1 rounded-full bg-blue-600 text-white font-bold text-xs sm:text-sm shadow-md transition-all duration-300">
                Vez do Jogador 1
            </div>
            <div class="text-xs font-mono font-bold text-amber-400 bg-slate-900/80 px-3 py-0.5 rounded-full border border-slate-700">
                ⏱️ Tempo: <span id="timerDisplay">10</span>s
            </div>
        </div>

        <div class="flex items-center justify-end gap-2.5 pr-2">
            <div class="text-right">
                <div class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Jogador 2</div>
                <div id="p2-stats" class="text-sm sm:text-base font-extrabold text-red-400">8 Vivos</div>
            </div>
            <div class="w-3.5 h-3.5 rounded-full bg-red-600 ring-4 ring-red-500/20"></div>
        </div>
    </div>

    <div class="stage-3d flex items-center justify-center my-auto">
        <div id="paperBoard" class="paper-board cursor-crosshair">
            <div id="leafLeft" class="leaf-half leaf-left">
                <div class="leaf-front notebook-paper">
                    <canvas id="canvasLeft" width="450" height="520" class="w-full h-full block"></canvas>
                    <div id="shadowLeft" class="shadow-layer"></div>
                </div>
                <div class="leaf-back">
                    <canvas id="canvasBackLeft" width="450" height="520" class="w-full h-full block"></canvas>
                </div>
            </div>

            <div id="leafRight" class="leaf-half leaf-right">
                <div class="leaf-front notebook-paper">
                    <canvas id="canvasRight" width="450" height="520" class="w-full h-full block"></canvas>
                    <div id="shadowRight" class="shadow-layer"></div>
                </div>
                <div class="leaf-back">
                    <canvas id="canvasBackRight" width="450" height="520" class="w-full h-full block"></canvas>
                </div>
            </div>

            <div class="absolute left-1/2 top-0 bottom-0 w-1 -translate-x-1/2 bg-slate-400/40 border-r border-dashed border-slate-500/60 z-30 pointer-events-none"></div>
        </div>
    </div>

    <div id="modalVitoria" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <div class="text-4xl mb-3">🏆</div>
            <h2 id="modalTitulo" class="text-xl font-bold text-amber-300 mb-2">Vitória!</h2>
            <p id="modalMensagem" class="text-slate-300 text-sm mb-5">O exército inimigo foi derrotado.</p>
            <button onclick="reiniciarPartida()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition-all shadow-lg active:scale-95">
                Jogar Novamente
            </button>
        </div>
    </div>

    <script>
        class MenuJogo {
            constructor() {
                this.numBonecos = 8;
                this.tempoTiro = 15;
            }

            exibir() {
                if (document.getElementById('menuOverlay')) return;

                const menuOverlay = document.createElement('div');
                menuOverlay.id = 'menuOverlay';
                menuOverlay.className = 'fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4';
                
                menuOverlay.innerHTML = `
                    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                        <h1 class="text-3xl font-black text-amber-100 mb-6 flex items-center justify-center gap-2">
                            <span>📝</span> Configurações
                        </h1>
                        
                        <div class="space-y-6">
                            <div>
                                <label class="block text-slate-400 text-sm font-semibold mb-2 uppercase tracking-wider">
                                    Bonecos por Jogador (5 a 15):<br>
                                    <span id="valBonecos" class="text-amber-400 font-black text-2xl">${this.numBonecos}</span>
                                </label>
                                <div class="flex items-center justify-center gap-4">
                                    <button id="btnMenosBonecos" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 rounded-full font-bold text-lg transition-all active:scale-95 text-white">-</button>
                                    <button id="btnMaisBonecos" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 rounded-full font-bold text-lg transition-all active:scale-95 text-white">+</button>
                                </div>
                            </div>

                            <div>
                                <label class="block text-slate-400 text-sm font-semibold mb-2 uppercase tracking-wider">
                                    Tempo por Tiro (15s a 25s):<br>
                                    <span id="valTempo" class="text-amber-400 font-black text-2xl">${this.tempoTiro}s</span>
                                </label>
                                <div class="flex items-center justify-center gap-4">
                                    <button id="btnMenosTempo" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 rounded-full font-bold text-lg transition-all active:scale-95 text-white">-</button>
                                    <button id="btnMaisTempo" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 rounded-full font-bold text-lg transition-all active:scale-95 text-white">+</button>
                                </div>
                            </div>

                            <button id="btnIniciar" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded-xl transition-all shadow-lg shadow-amber-600/20 active:scale-95 text-base mt-4">
                                Iniciar Partida
                            </button>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(menuOverlay);
                this.adicionarEventos();
            }

            adicionarEventos() {
                document.getElementById('btnMenosBonecos').addEventListener('click', () => {
                    if (this.numBonecos > 5) {
                        this.numBonecos--;
                        document.getElementById('valBonecos').innerText = this.numBonecos;
                    }
                });

                document.getElementById('btnMaisBonecos').addEventListener('click', () => {
                    if (this.numBonecos < 15) {
                        this.numBonecos++;
                        document.getElementById('valBonecos').innerText = this.numBonecos;
                    }
                });

                document.getElementById('btnMenosTempo').addEventListener('click', () => {
                    if (this.tempoTiro > 15) {
                        this.tempoTiro--;
                        document.getElementById('valTempo').innerText = this.tempoTiro + 's';
                    }
                });

                document.getElementById('btnMaisTempo').addEventListener('click', () => {
                    if (this.tempoTiro < 25) {
                        this.tempoTiro++;
                        document.getElementById('valTempo').innerText = this.tempoTiro + 's';
                    }
                });

                document.getElementById('btnIniciar').addEventListener('click', () => {
                    document.getElementById('menuOverlay').remove();
                    iniciarJogoConfigurado(this.numBonecos, this.tempoTiro);
                });
            }
        }

        const canvasLeft = document.getElementById('canvasLeft');
        const ctxLeft = canvasLeft.getContext('2d');
        const canvasRight = document.getElementById('canvasRight');
        const ctxRight = canvasRight.getContext('2d');
        const canvasBackLeft = document.getElementById('canvasBackLeft');
        const ctxBackLeft = canvasBackLeft.getContext('2d');
        const canvasBackRight = document.getElementById('canvasBackRight');
        const ctxBackRight = canvasBackRight.getContext('2d');

        const leafLeft = document.getElementById('leafLeft');
        const leafRight = document.getElementById('leafRight');
        const shadowLeft = document.getElementById('shadowLeft');
        const shadowRight = document.getElementById('shadowRight');
        const paperBoard = document.getElementById('paperBoard');

        const menuInstancia = new MenuJogo();

        let unidades = [];
        let tiros = [];
        let turnoAtual = 1; 
        let animando = false;
        
        let configBonecos = 8;
        let configTempo = 15;
        let tempoRestante = 15;
        let timerInterval = null;

        const CANVAS_WIDTH = 900;
        const CANVAS_HEIGHT = 520;
        const HALF_WIDTH = 450;
        const RAIO_COLISAO = 18;
        const ESPACO_MINIMO = 40;

        function abrirMenu() {
            pararCronometro();
            menuInstancia.exibir();
        }

        function iniciarJogoConfigurado(numBonecos, tempoTiro) {
            configBonecos = numBonecos;
            configTempo = tempoTiro;
            reiniciarPartida();
        }

        function reiniciarPartida() {
            pararCronometro();
            unidades = [];
            tiros = [];
            turnoAtual = 1;
            animando = false;

            leafLeft.style.transform = 'rotateY(0deg)';
            leafRight.style.transform = 'rotateY(0deg)';
            shadowLeft.style.opacity = '0';
            shadowRight.style.opacity = '0';

            for (let i = 0; i < configBonecos; i++) {
                unidades.push(gerarPosicaoValida(1, 60, HALF_WIDTH - 40));
            }

            for (let i = 0; i < configBonecos; i++) {
                unidades.push(gerarPosicaoValida(2, HALF_WIDTH + 40, CANVAS_WIDTH - 40));
            }

            atualizarUI();
            desenharTudo();
            iniciarCronometro();
        }

        function iniciarCronometro() {
            pararCronometro();
            tempoRestante = configTempo;
            document.getElementById('timerDisplay').innerText = tempoRestante;

            timerInterval = setInterval(() => {
                if (animando) return;

                tempoRestante--;
                document.getElementById('timerDisplay').innerText = tempoRestante;

                if (tempoRestante <= 0) {
                    passarTurnoPorTempo();
                }
            }, 1000);
        }

        function pararCronometro() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function passarTurnoPorTempo() {
            pararCronometro();
            turnoAtual = turnoAtual === 1 ? 2 : 1;
            atualizarUI();
            iniciarCronometro();
        }

        function gerarPosicaoValida(jogador, minX, maxX) {
            let maxTentativas = 300;
            let tentativa = 0;
            let novoX, novoY;
            let valido = false;

            while (!valido && tentativa < maxTentativas) {
                novoX = minX + Math.random() * (maxX - minX);
                novoY = 50 + Math.random() * (CANVAS_HEIGHT - 90);

                valido = !unidades.some(u => Math.hypot(u.x - novoX, u.y - novoY) < ESPACO_MINIMO);
                tentativa++;
            }

            return { jogador, x: novoX, y: novoY, vivo: true, inclinacao: (Math.random() - 0.5) * 0.2 };
        }

        function desenharLinhasCaderno(ctx, isLeft) {
            ctx.fillStyle = '#fbfaf5';
            ctx.fillRect(0, 0, HALF_WIDTH, CANVAS_HEIGHT);

            ctx.beginPath();
            const xMargem = isLeft ? 55 : 30;
            ctx.moveTo(xMargem, 0);
            ctx.lineTo(xMargem, CANVAS_HEIGHT);
            ctx.strokeStyle = '#f87171';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1;
            for (let y = 26; y < CANVAS_HEIGHT; y += 26) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(HALF_WIDTH, y);
                ctx.stroke();
            }
        }

        function desenharTudo() {
            desenharLinhasCaderno(ctxLeft, true);
            unidades.filter(u => u.x < HALF_WIDTH).forEach(u => desenharSoldado(ctxLeft, u, u.x, u.y));
            tiros.filter(t => t.x < HALF_WIDTH).forEach(t => desenharTinta(ctxLeft, t, t.x, t.y));

            desenharLinhasCaderno(ctxRight, false);
            unidades.filter(u => u.x >= HALF_WIDTH).forEach(u => desenharSoldado(ctxRight, u, u.x - HALF_WIDTH, u.y));
            tiros.filter(t => t.x >= HALF_WIDTH).forEach(t => desenharTinta(ctxRight, t, t.x - HALF_WIDTH, t.y));

            desenharVersoFolha(ctxBackLeft, 1);
            desenharVersoFolha(ctxBackRight, 2);
        }

        function desenharVersoFolha(ctx, jogadorOwner) {
            ctx.clearRect(0, 0, HALF_WIDTH, CANVAS_HEIGHT);
            const meusTiros = tiros.filter(t => !t.espelhado && ((jogadorOwner === 1 && t.x < HALF_WIDTH) || (jogadorOwner === 2 && t.x >= HALF_WIDTH)));

            meusTiros.forEach(t => {
                const localXOriginal = jogadorOwner === 1 ? t.x : t.x - HALF_WIDTH;
                const versoX = HALF_WIDTH - localXOriginal; 
                const versoY = t.y;

                ctx.save();
                ctx.translate(versoX, versoY);

                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(30, 58, 138, 0.55)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, 11, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(30, 58, 138, 0.2)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(100, 116, 139, 0.3)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore();
            });
        }

        function desenharSoldado(ctx, u, localX, localY) {
            ctx.save();
            ctx.translate(localX, localY);
            ctx.rotate(u.inclinacao);

            const corPen = u.vivo ? '#1e3a8a' : '#64748b';
            ctx.strokeStyle = corPen;
            ctx.fillStyle = corPen;
            ctx.lineWidth = 2.2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.arc(0, -14, 5.5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, -8.5); ctx.lineTo(0, 8);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-7, -2); ctx.lineTo(0, -5); ctx.lineTo(8, -1);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-6, -4); ctx.lineTo(12, -4);
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.8;
            ctx.stroke();

            ctx.strokeStyle = corPen;
            ctx.lineWidth = 2.2;

            ctx.beginPath();
            ctx.moveTo(0, 8); ctx.lineTo(-7, 20);
            ctx.moveTo(0, 8); ctx.lineTo(7, 20);
            ctx.stroke();

            if (!u.vivo) {
                ctx.strokeStyle = '#dc2626';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(-14, -20); ctx.lineTo(14, 22);
                ctx.moveTo(12, -20); ctx.lineTo(-12, 22);
                ctx.stroke();
            }

            ctx.restore();
        }

        function desenharTinta(ctx, t, localX, localY) {
            ctx.save();
            ctx.translate(localX, localY);

            const baseColor = t.espelhado ? 'rgba(30, 58, 138, 0.72)' : '#1d4ed8';
            ctx.fillStyle = baseColor;
            ctx.strokeStyle = baseColor;

            ctx.beginPath();
            const raio = t.espelhado ? 6 : 5;
            ctx.arc(0, 0, raio, 0, Math.PI * 2);
            ctx.fill();

            const s = t.seed || 1;
            for (let i = 0; i < 5; i++) {
                const ang = (i * 72 + s * 10) * Math.PI / 180;
                const dist = 4 + (i % 3) * 2;
                const rDrop = 1 + (i % 2) * 0.8;

                ctx.beginPath();
                ctx.arc(Math.cos(ang) * dist, Math.sin(ang) * dist, rDrop, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function registrarTiro(e) {
            if (animando) return;

            const rect = paperBoard.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;

            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            if (turnoAtual === 1 && clickX >= HALF_WIDTH) return;
            if (turnoAtual === 2 && clickX < HALF_WIDTH) return;

            pararCronometro();

            tiros.push({ x: clickX, y: clickY, espelhado: false, seed: Math.random() });

            const reflexoX = CANVAS_WIDTH - clickX;
            const reflexoY = clickY;

            desenharTudo();
            animarDobraRealista(clickX, clickY, reflexoX, reflexoY);
        }

        function animarDobraRealista(clickX, clickY, reflexoX, reflexoY) {
            animando = true;
            let progresso = 0;
            let fase = 'fechando'; 
            let tempoPressao = 0;

            const folhaAtiva = turnoAtual === 1 ? leafLeft : leafRight;
            const folhaEstatica = turnoAtual === 1 ? leafRight : leafLeft;
            const sombraOutra = turnoAtual === 1 ? shadowRight : shadowLeft;

            folhaAtiva.style.zIndex = '50';
            folhaEstatica.style.zIndex = '5';

            const timer = setInterval(() => {
                if (fase === 'fechando') {
                    progresso += 0.025;

                    if (progresso >= 1) {
                        progresso = 1;
                        fase = 'pressionando';

                        tiros.push({ x: reflexoX, y: reflexoY, espelhado: true, seed: Math.random() });

                        unidades.forEach(u => {
                            if (u.jogador !== turnoAtual && u.vivo) {
                                if (Math.hypot(u.x - reflexoX, u.y - reflexoY) <= RAIO_COLISAO) {
                                    u.vivo = false;
                                }
                            }
                        });

                        desenharTudo();
                    }
                } else if (fase === 'pressionando') {
                    tempoPressao += 1;
                    if (tempoPressao > 12) { 
                        fase = 'abrindo';
                    }
                } else if (fase === 'abrindo') {
                    progresso -= 0.025;

                    if (progresso <= 0) {
                        progresso = 0;
                        clearInterval(timer);

                        folhaAtiva.style.zIndex = '10';
                        folhaEstatica.style.zIndex = '10';

                        turnoAtual = turnoAtual === 1 ? 2 : 1;
                        animando = false;
                        atualizarUI();

                        if (!checarFimDeJogo()) {
                            iniciarCronometro();
                        }
                    }
                }

                const angulo = turnoAtual === 1 ? (progresso * 180) : (-progresso * 180);
                folhaAtiva.style.transform = `rotateY(${angulo}deg)`;
                sombraOutra.style.opacity = (Math.sin(progresso * Math.PI) * 0.45).toFixed(2);

            }, 10);
        }

        function atualizarUI() {
            const p1Vivos = unidades.filter(u => u.jogador === 1 && u.vivo).length;
            const p2Vivos = unidades.filter(u => u.jogador === 2 && u.vivo).length;

            document.getElementById('p1-stats').innerText = `${p1Vivos} Vivos`;
            document.getElementById('p2-stats').innerText = `${p2Vivos} Vivos`;

            const badge = document.getElementById('turn-badge');
            if (turnoAtual === 1) {
                badge.innerText = "Vez do Jogador 1 (Esquerda)";
                badge.className = "inline-block px-4 py-1 rounded-full bg-blue-600 text-white font-bold text-xs sm:text-sm shadow-md transition-all duration-300";
            } else {
                badge.innerText = "Vez do Jogador 2 (Direita)";
                badge.className = "inline-block px-4 py-1 rounded-full bg-red-600 text-white font-bold text-xs sm:text-sm shadow-md transition-all duration-300";
            }
        }

        function checarFimDeJogo() {
            const p1Vivos = unidades.filter(u => u.jogador === 1 && u.vivo).length;
            const p2Vivos = unidades.filter(u => u.jogador === 2 && u.vivo).length;

            if (p1Vivos === 0 || p2Vivos === 0) {
                pararCronometro();
                const modal = document.getElementById('modalVitoria');
                const titulo = document.getElementById('modalTitulo');
                const mensagem = document.getElementById('modalMensagem');

                if (p1Vivos === 0 && p2Vivos === 0) {
                    titulo.innerText = "Empate!";
                    mensagem.innerText = "Ambos os exércitos foram eliminados!";
                } else if (p1Vivos > 0) {
                    titulo.innerText = "Vitória do Jogador 1! 🏆";
                    mensagem.innerText = "O Jogador 1 destruiu todas as tropas inimigas.";
                } else {
                    titulo.innerText = "Vitória do Jogador 2! 🏆";
                    mensagem.innerText = "O Jogador 2 destruiu todas as tropas inimigas.";
                }

                modal.classList.remove('hidden');
                return true;
            }
            return false;
        }

        paperBoard.addEventListener('click', registrarTiro);

        window.onload = () => {
            menuInstancia.exibir();
        };
    </script>
</body>
</html>
